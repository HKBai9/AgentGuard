[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "1.1.1"
description = "AI Agent 工具调用安全防护：边界逃逸检测与风险隔离（四层策略引擎，框架无关）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HKBai9" }]
keywords = [
    "ai-security", "llm-agent", "agent-security", "guardrails",
    "tool-calling", "prompt-injection", "access-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# 策略加载必需 PyYAML；没有静默解析回退。
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# 读取 YAML 策略（推荐装上）
yaml = ["PyYAML>=6.0"]
# 演示界面
demo = ["streamlit>=1.30", "PyYAML>=6.0"]
# 开发/测试
dev = ["pytest>=8.0", "PyYAML>=6.0"]
langchain = ["langchain-core"]

[project.scripts]
agentguard = "agentguard.cli:main"

[project.urls]
Homepage = "https://github.com/HKBai9/AgentGuard"
Repository = "https://github.com/HKBai9/AgentGuard"
Issues = "https://github.com/HKBai9/AgentGuard/issues"

[tool.setuptools]
packages = ["agentguard"]

[tool.setuptools.package-data]
agentguard = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
