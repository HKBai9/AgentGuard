[build-system]
requires = ["setuptools==80.9.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "2.0.0a1"
description = "AgentGuard v2 安全运行时：隔离审查、数据约束、原子许可和恢复；保留旧版 SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "HKBai9" }]
keywords = [
    "ai-security", "llm-agent", "agent-security", "guardrails",
    "tool-calling", "prompt-injection", "access-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3.12",
]
# 策略加载必需 PyYAML；没有静默解析回退。
dependencies = ["PyYAML==6.0.3", "pydantic==2.14.1", "jsonschema==4.26.0"]

[project.optional-dependencies]
# 读取 YAML 策略（推荐装上）
yaml = ["PyYAML>=6.0"]
# 演示界面
demo = ["streamlit>=1.30", "PyYAML>=6.0"]
# 开发/测试
langchain = ["langchain-core==1.6.13"]
gateway = ["fastapi==0.156.8", "uvicorn==0.54.0", "httpx==0.28.1"]
v2-console = ["streamlit==1.56.0", "graphviz==0.21"]
mcp = ["mcp==1.28.1"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "build==1.6.1", "PyYAML==6.0.3"]

[project.scripts]
agentguard = "agentguard.cli:main"
agentguard-v2 = "agentguard.v2.gateway.cli:main"
agentguard-v2-agent = "agentguard.v2.application:main"
agentguard-v2-console = "agentguard.v2.console:main"

[project.urls]
Homepage = "https://github.com/HKBai9/AgentGuard"
Repository = "https://github.com/HKBai9/AgentGuard"
Issues = "https://github.com/HKBai9/AgentGuard/issues"

[tool.setuptools.packages.find]
include = ["agentguard", "agentguard.*"]

[tool.setuptools.package-data]
agentguard = ["data/*.yaml", "py.typed"]
"agentguard.v2.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
